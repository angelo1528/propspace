<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PropSpace — Fleet Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ps-bg:#F6F7F4;
    --ps-surface:#FFFFFF;
    --ps-ink:#121A1E;
    --ps-ink-soft:#4B565C;
    --ps-muted:#8A9399;
    --ps-border:#E1E5E1;
    --ps-primary:#0e265b;
    --ps-primary-dark:#183c8b;
    --ps-primary-soft:#E4EEEC;
    --ps-accent:#E2A33B;
    --ps-accent-soft:#FBF0DC;
    --ps-danger:#C1473B;
    --ps-danger-soft:#F8E7E4;
    --ps-success:#2F8F5B;
    --ps-success-soft:#E6F3EB;
    --ps-warning:#D98F2B;
    --ps-warning-soft:#FBF0DC;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --shadow-card: 0 1px 2px rgba(18,26,30,0.04);
    --shadow-pop: 0 12px 32px rgba(18,26,30,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ps-bg);
    color:var(--ps-ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--ps-accent-soft);}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:250px;flex-shrink:0;background:var(--ps-surface);
    border-right:1px solid var(--ps-border);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;}
  .brand-mark{
    width:32px;height:32px;border-radius:9px;background:var(--ps-primary);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-family:'Space Grotesk';font-weight:700;font-size:17px;color:var(--ps-ink);}
  .brand-sub{font-size:10.5px;color:var(--ps-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:1px;}

  .nav{padding:6px 10px 20px;flex:1;}
  .nav-section{margin-top:16px;}
  .nav-label{
    font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ps-muted);padding:6px 10px 6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-s);
    color:var(--ps-ink-soft);font-size:13.5px;font-weight:500;margin-bottom:2px;
    position:relative;transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--ps-bg);color:var(--ps-ink);cursor:pointer;}
  .nav-item.active{background:var(--ps-primary-soft);color:var(--ps-primary-dark);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-item.locked{color:var(--ps-muted);}
  .nav-item.locked:hover{background:var(--ps-bg);color:var(--ps-ink-soft);}
  .soon-pill{
    margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.02em;
    background:var(--ps-accent-soft);color:#8A5E12;padding:2px 6px;border-radius:20px;
    font-family:'Inter';flex-shrink:0;
  }

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:60px;border-bottom:1px solid var(--ps-border);background:var(--ps-surface);
    display:flex;align-items:center;justify-content:space-between;padding:0 24px;
    position:sticky;top:0;z-index:5;
  }
  .topbar-title{font-family:'Space Grotesk';font-weight:600;font-size:16px;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--ps-bg);
    border:1px solid var(--ps-border);border-radius:var(--radius-s);padding:7px 12px;width:260px;
  }
  .search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;font-family:inherit;color:var(--ps-ink);}
  .search-box svg{width:15px;height:15px;color:var(--ps-muted);flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--radius-s);border:1px solid var(--ps-border);
    background:var(--ps-surface);display:flex;align-items:center;justify-content:center;color:var(--ps-ink-soft);
  }
  .icon-btn svg{width:16px;height:16px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--ps-primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;font-family:'Space Grotesk';
  }
  .content{padding:24px 28px 60px;flex:1;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--radius-s);
    font-size:13.5px;font-weight:600;border:1px solid transparent;transition:transform .05s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn svg{width:15px;height:15px;}
  .btn-primary{background:var(--ps-primary);color:#fff;}
  .btn-primary:hover{background:var(--ps-primary-dark);}
  .btn-ghost{background:var(--ps-surface);border-color:var(--ps-border);color:var(--ps-ink);}
  .btn-ghost:hover{background:var(--ps-bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}

  /* ---------- Cards / KPIs ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px;}
  .kpi-card{
    background:var(--ps-surface);border:1px solid var(--ps-border);border-radius:var(--radius-m);
    padding:16px 16px;box-shadow:var(--shadow-card);
  }
  .kpi-label{font-size:11.5px;color:var(--ps-muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
  .kpi-value{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin-top:6px;}
  .kpi-delta{font-size:12px;margin-top:5px;font-weight:600;}
  .kpi-delta.up{color:var(--ps-success);}
  .kpi-delta.down{color:var(--ps-danger);}
  .kpi-delta.flat{color:var(--ps-muted);}

  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .panel{
    background:var(--ps-surface);border:1px solid var(--ps-border);border-radius:var(--radius-m);
    padding:18px 20px;box-shadow:var(--shadow-card);
  }
  .panel-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:14px;}
  .panel-title{font-family:'Space Grotesk';font-weight:600;font-size:15px;}
  .panel-sub{font-size:12px;color:var(--ps-muted);margin-top:2px;}

  /* fleet status bars */
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .bar-label{width:120px;font-size:12.5px;color:var(--ps-ink-soft);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--ps-bg);border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:20px;}
  .bar-count{width:34px;text-align:right;font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono';flex-shrink:0;}

  .activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ps-border);}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .activity-text{font-size:12.8px;color:var(--ps-ink-soft);}
  .activity-time{font-size:11px;color:var(--ps-muted);margin-top:1px;}

  /* ---------- Status badges ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
    font-size:11.5px;font-weight:600;white-space:nowrap;
  }
  .badge:before{content:'';width:6px;height:6px;border-radius:50%;}
  .badge-available{background:var(--ps-success-soft);color:#1f2d6b;}
  .badge-available:before{background:var(--ps-success);}
  .badge-rented{background:var(--ps-primary-soft);color:var(--ps-primary-dark);}
  .badge-rented:before{background:var(--ps-primary);}
  .badge-maintenance{background:var(--ps-warning-soft);color:#8A5E12;}
  .badge-maintenance:before{background:var(--ps-warning);}
  .badge-out{background:var(--ps-danger-soft);color:#8C3329;}
  .badge-out:before{background:var(--ps-danger);}
  .badge-neutral{background:#EEF0EE;color:#5A6460;}
  .badge-neutral:before{background:#8A9399;}
  .badge-refunded{background:#EFE9F7;color:#5B3E8C;}
  .badge-refunded:before{background:#8B5FBF;}

  /* ---------- Plate tag (signature element) ---------- */
  .plate{
    display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-weight:600;
    font-size:12px;letter-spacing:.04em;background:#FBFBF9;border:1.5px solid var(--ps-ink);
    border-radius:5px;padding:3px 9px 3px 7px;position:relative;color:var(--ps-ink);
  }
  .plate:before, .plate:after{
    content:'';position:absolute;width:3px;height:3px;border-radius:50%;background:var(--ps-border);
    border:1px solid var(--ps-ink-soft);top:2px;
  }
  .plate:before{left:2px;}
  .plate:after{right:2px;}
  .plate-state{font-size:8px;color:var(--ps-muted);font-weight:600;letter-spacing:.05em;}

  /* ---------- Coming soon ---------- */
  .soon-wrap{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:60vh;text-align:center;
  }
  .soon-icon{
    width:64px;height:64px;border-radius:18px;background:var(--ps-primary-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--ps-primary);
  }
  .soon-icon svg{width:30px;height:30px;}
  .soon-wrap h2{font-size:20px;margin:0 0 8px;}
  .soon-wrap p{color:var(--ps-ink-soft);font-size:13.5px;max-width:380px;margin:0 0 6px;}
  .soon-phase{
    margin-top:14px;font-size:11.5px;font-weight:600;color:#8A5E12;background:var(--ps-accent-soft);
    padding:5px 12px;border-radius:20px;letter-spacing:.03em;
  }

  /* ---------- Fleet module ---------- */
  .fleet-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:6px 13px;border-radius:20px;border:1px solid var(--ps-border);background:var(--ps-surface);
    font-size:12.5px;font-weight:600;color:var(--ps-ink-soft);
  }
  .chip.active{background:var(--ps-ink);color:#ffffff;border-color:var(--ps-ink);}
  .view-toggle{display:flex;border:1px solid var(--ps-border);border-radius:var(--radius-s);overflow:hidden;}
  .view-toggle button{padding:7px 11px;background:var(--ps-surface);border:none;display:flex;align-items:center;color:var(--ps-muted);}
  .view-toggle button.active{background:var(--ps-bg);color:var(--ps-ink);}
  .view-toggle button svg{width:15px;height:15px;}

  .fleet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;}
  .vcard{
    background:var(--ps-surface);border:1px solid var(--ps-border);border-radius:var(--radius-m);
    overflow:hidden;box-shadow:var(--shadow-card);cursor:pointer;transition:box-shadow .15s ease, transform .1s ease;
  }
  .vcard:hover{box-shadow:var(--shadow-pop);transform:translateY(-1px);}
  .vcard-media{
    height:96px;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .vcard-media svg{width:52px;height:52px;opacity:.9;}
  .vcard-media .badge{position:absolute;top:10px;right:10px;}
  .vcard-body{padding:13px 14px 14px;}
  .vcard-title{font-family:'Space Grotesk';font-weight:600;font-size:14.5px;}
  .vcard-sub{font-size:11.5px;color:var(--ps-muted);margin-top:1px;}
  .vcard-meta{display:flex;align-items:center;justify-content:space-between;margin-top:11px;}
  .vcard-stats{display:flex;gap:14px;margin-top:11px;padding-top:11px;border-top:1px solid var(--ps-border);}
  .vcard-stat{font-size:11px;color:var(--ps-muted);}
  .vcard-stat b{display:block;font-family:'IBM Plex Mono';font-size:12.5px;color:var(--ps-ink);font-weight:600;margin-top:1px;}
  .due-flag{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#8A5E12;font-weight:600;margin-top:9px;background:var(--ps-accent-soft);padding:4px 8px;border-radius:6px;}
  .due-flag svg{width:11px;height:11px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ps-muted);
    font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--ps-border);
  }
  tbody td{padding:12px;border-bottom:1px solid var(--ps-border);vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover td{background:var(--ps-bg);}
  tbody tr:last-child td{border-bottom:none;}
  .t-veh{display:flex;align-items:center;gap:10px;}
  .t-veh-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .t-veh-icon svg{width:18px;height:18px;}
  .t-name{font-weight:600;font-size:13px;}
  .t-sub{font-size:11px;color:var(--ps-muted);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ps-muted);}

  /* ---------- Modal / drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(18,26,30,0.4);display:none;align-items:stretch;
    justify-content:flex-end;z-index:50;
  }
  .overlay.open{display:flex;}
  .drawer{
    width:440px;max-width:92vw;background:var(--ps-surface);height:100%;overflow-y:auto;
    box-shadow:-8px 0 32px rgba(0,0,0,0.12);animation:slideIn .18s ease;
  }
  @keyframes slideIn{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .drawer-head{
    padding:20px 22px;border-bottom:1px solid var(--ps-border);display:flex;align-items:flex-start;justify-content:space-between;
    position:sticky;top:0;background:var(--ps-surface);
  }
  .drawer-body{padding:20px 22px 40px;}
  .close-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--ps-border);background:var(--ps-surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .close-x svg{width:14px;height:14px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;}
  .detail-field label{display:block;font-size:10.5px;color:var(--ps-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px;}
  .detail-field div{font-size:13.5px;font-weight:500;}
  .section-title{font-family:'Space Grotesk';font-weight:600;font-size:13.5px;margin:22px 0 10px;}
  .mini-list-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ps-border);font-size:12.8px;}
  .mini-list-item:last-child{border-bottom:none;}

  /* Modal (Add Vehicle) */
  .modal-overlay{position:fixed;inset:0;background:rgba(18,26,30,0.4);display:none;align-items:center;justify-content:center;z-index:60;}
  .modal-overlay.open{display:flex;}
  .modal{width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--ps-surface);border-radius:var(--radius-l);box-shadow:var(--shadow-pop);}
  .modal-head{padding:20px 22px;border-bottom:1px solid var(--ps-border);display:flex;align-items:center;justify-content:space-between;}
  .modal-body{padding:20px 22px;}
  .form-row{margin-bottom:14px;}
  .form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-row label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ps-ink-soft);}
  .form-row input, .form-row select{
    width:100%;padding:9px 11px;border:1px solid var(--ps-border);border-radius:var(--radius-s);
    font-family:inherit;font-size:13px;outline:none;background:var(--ps-surface);color:var(--ps-ink);
  }
  .form-row textarea{
    width:100%;padding:9px 11px;border:1px solid var(--ps-border);border-radius:var(--radius-s);
    font-family:inherit;font-size:13px;outline:none;background:var(--ps-surface);color:var(--ps-ink);
    resize:vertical;min-height:64px;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{border-color:var(--ps-primary);}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--ps-border);display:flex;justify-content:flex-end;gap:10px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#D6DAD5;border-radius:20px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:1100px){
    .kpi-row{grid-template-columns:repeat(3,1fr);}
    .fleet-grid{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<!-- ===== CHANGED: new welcome / name-entry screen ===== -->
<div class="modal-overlay open" id="welcomeOverlay" style="z-index:100;">
  <div class="modal" style="width:420px;">
    <div class="modal-body" style="padding:38px 32px 30px;text-align:center;">
      <div class="brand-mark" style="margin:0 auto 18px;">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h6M15 12h6M9 12l1.5-3M13.5 15L15 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="12" r="1.4" fill="#E2A33B"/><circle cx="15" cy="12" r="1.4" fill="#E2A33B"/></svg>
      </div>
      <h2 style="margin:0 0 8px;font-size:19px;">Welcome to PropSpace</h2>
      <p style="color:var(--ps-ink-soft);font-size:13.5px;margin:0 0 20px;">What's your name? This is your console — we'll use it to personalize things from here on.</p>
      <input id="ownerNameInput" placeholder="e.g. Marcus Reyes" autocomplete="off"
        style="width:100%;padding:11px 13px;border:1px solid var(--ps-border);border-radius:8px;font-size:14px;font-family:inherit;text-align:center;outline:none;"
        onkeydown="if(event.key==='Enter')submitOwnerName()" />
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:16px;" onclick="submitOwnerName()">Continue</button>
    </div>
  </div>
</div>
<!-- ===== END CHANGED ===== -->

<!-- CHANGED: was <div class="app"> — now hidden until name is submitted -->
<div class="app" id="appRoot" style="display:none;">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12h6M15 12h6M9 12l1.5-3M13.5 15L15 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="12" r="1.4" fill="#E2A33B"/><circle cx="15" cy="12" r="1.4" fill="#E2A33B"/></svg>
      </div>
      <div>
        <div class="brand-name">PropSpace</div>
        <div class="brand-sub">Owner Console</div>
      </div>
    </div>

    <nav class="nav" id="navList"></nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input placeholder="Search your fleet, customers, bookings…" />
        </div>
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <div style="display:flex;align-items:center;gap:9px;padding-left:8px;border-left:1px solid var(--ps-border);">
          <div style="text-align:right;line-height:1.25;">
            <!-- CHANGED: was static "Marcus Reyes", now filled in by JS -->
            <div id="ownerNameDisplay" style="font-size:12.5px;font-weight:600;color:var(--ps-ink);">Owner</div>
            <div style="font-size:10.5px;color:var(--ps-muted);">Owner</div>
          </div>
          <!-- CHANGED: was static "MR", now filled in by JS -->
          <div class="avatar" id="ownerInitials">—</div>
        </div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- DETAIL DRAWER -->
<div class="overlay" id="drawerOverlay">
  <div class="drawer" id="drawer"></div>
</div>

<!-- ADD VEHICLE MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <div class="panel-title">Add vehicle</div>

  const diffMin = Math.floor((Date.now() - ts) / 60000);
  if(diffMin < 1) return 'Just now';
  if(diffMin < 60) return `${diffMin} min ago`;
  const diffHr = Math.floor(diffMin/60);
  if(diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr/24);
  return `${diffDay}d ago`;
}

function renderDashboard(){
  const total = vehicles.length;
  const available = vehicles.filter(v=>v.status==='Available').length;
  const rented = vehicles.filter(v=>v.status==='Rented').length;
  const maint = vehicles.filter(v=>v.status==='Maintenance'||v.status==='Out of Service').length;
  const util = total ? Math.round((rented/total)*100) : 0; // CHANGED: guard against empty fleet

  const today = new Date();
  const hour = today.getHours();
  const greeting = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';

  // ===== CHANGED: profit calculations — revenue from reservations minus maintenance spend =====
  const revenueBooked = reservations.filter(r=>r.status==='Active'||r.status==='Completed').reduce((sum,r)=>sum+reservationTotal(r),0);
  const estRevenue = reservations.filter(r=>r.status==='Active'||r.status==='Completed'||r.status==='Upcoming').reduce((sum,r)=>sum+reservationTotal(r),0);
  const actualMaintCost = maintenanceRecords.filter(m=>m.status==='Completed').reduce((sum,m)=>sum+m.cost,0);

function statusBar(label,count,total,color){

}

/* ============ PAGE: FLEET ============ */
function statusBadgeClass(s){
  return {Available:'badge-available',Rented:'badge-rented',Maintenance:'badge-maintenance','Out of Service':'badge-out'}[s];
}
function filteredVehicles(){
  return vehicles.filter(v=>{
    const matchesStatus = fleetFilter==='All' || v.status===fleetFilter;
    const q = fleetSearch.toLowerCase();
    const matchesSearch = !q || (v.make+' '+v.model+' '+v.plate+' '+v.vin).toLowerCase().includes(q);
    return matchesStatus && matchesSearch;
  });
}
function renderFleet(){
  const total = vehicles.length;
  const available = vehicles.filter(v=>v.status==='Available').length;
  const util = total ? Math.round((vehicles.filter(v=>v.status==='Rented').length/total)*100) : 0; // CHANGED: guard
  const avgMiles = total ? Math.round(vehicles.reduce((a,v)=>a+v.mileage,0)/total) : 0; // CHANGED: guard

  const statuses = ['All','Available','Rented','Maintenance','Out of Service'];

  return `
    <div class="kpi-row" style="grid-template-columns:repeat(5,1fr);">
      <div class="kpi-card"><div class="kpi-label">Total Vehicles</div><div class="kpi-value">${total}</div></div>
      <div class="kpi-card"><div class="kpi-label">Available</div><div class="kpi-value">${available}</div></div>
      <div class="kpi-card"><div class="kpi-label">Utilization</div><div class="kpi-value">${util}%</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg. Mileage</div><div class="kpi-value">${(avgMiles/1000).toFixed(1)}k</div></div>

    <div class="fleet-toolbar">
      <div class="chip-row">

        <div class="search-box" style="width:220px;">

        <div class="view-toggle">
          <button class="${fleetView==='grid'?'active':''}" onclick="setFleetView('grid')">${ICONS.grid}</button>
          <button class="${fleetView==='list'?'active':''}" onclick="setFleetView('list')">${ICONS.list}</button>

function renderFleetGrid(list){

function renderFleetTable(list){

// ===== CHANGED: fix search box losing focus on every keystroke =====

/* ===== CHANGED: new Reservations & Booking module ===== */
/* ============ PAGE: BOOKING ============ */
function vehicleById(id){ return vehicles.find(v=>v.id===id); }
function nightsBetween(start,end){
  const ms = new Date(end) - new Date(start);
  return Math.max(1, Math.round(ms/(1000*60*60*24)));
}
function reservationTotal(r){
  const v = vehicleById(r.vehicleId);
  if(!v) return 0;
  return nightsBetween(r.start,r.end) * v.rate;
}
function fmtDate(d){
  return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
// ===== CHANGED: global currency formatter, used across Booking/Maintenance/Money modules =====
function fmtCurrency(n){
  return `${n<0?'-':''}$${Math.abs(Math.round(n)).toLocaleString()}`;
}
// ===== END CHANGED =====
function resBadgeClass(s){
  return {Upcoming:'badge-rented',Active:'badge-available',Completed:'badge-neutral',Cancelled:'badge-out'}[s];
}
/* ===== CHANGED: Completed AND Cancelled are both hidden under "All" — only shown when their chip is picked ===== */
function filteredReservations(){
  return reservations.filter(r=>{
    const matchesStatus = bookingFilter==='All'
      ? (r.status!=='Completed' && r.status!=='Cancelled')
      : r.status===bookingFilter;
    const q = bookingSearch.toLowerCase();
    const v = vehicleById(r.vehicleId);
    const vehLabel = v ? `${v.make} ${v.model} ${v.plate}` : '';
    const matchesSearch = !q || (r.customer+' '+vehLabel).toLowerCase().includes(q);
    return matchesStatus && matchesSearch;
  }).sort((a,b)=> new Date(a.start) - new Date(b.start));
}
/* ===== END CHANGED ===== */
function renderBooking(){
  const upcoming = reservations.filter(r=>r.status==='Upcoming').length;
  const active = reservations.filter(r=>r.status==='Active').length;
  const completedThisMonth = reservations.filter(r=>r.status==='Completed').length;
  // ===== CHANGED: Revenue Booked now excludes Upcoming; Est. Revenue is the new bubble that includes it =====
  const revenueBooked = reservations
    .filter(r=>r.status==='Active' || r.status==='Completed')
    .reduce((sum,r)=>sum+reservationTotal(r),0);
  const estRevenue = reservations
    .filter(r=>r.status==='Active' || r.status==='Completed' || r.status==='Upcoming')
    .reduce((sum,r)=>sum+reservationTotal(r),0);
  // ===== END CHANGED =====

  const list = filteredReservations();
  const statuses = ['All','Upcoming','Active','Completed','Cancelled'];

  return `
    <div class="kpi-row" style="grid-template-columns:repeat(5,1fr);">
      <div class="kpi-card"><div class="kpi-label">Upcoming</div><div class="kpi-value">${upcoming}</div></div>
      <div class="kpi-card"><div class="kpi-label">Active Now</div><div class="kpi-value">${active}</div></div>
      <div class="kpi-card"><div class="kpi-label">Completed</div><div class="kpi-value">${completedThisMonth}</div></div>
      <div class="kpi-card"><div class="kpi-label">Revenue Booked</div><div class="kpi-value">$${revenueBooked.toLocaleString()}</div></div>
      <div class="kpi-card"><div class="kpi-label">Est. Revenue</div><div class="kpi-value">$${estRevenue.toLocaleString()}</div><div class="kpi-delta flat">Incl. upcoming</div></div>
    </div>

    <div class="fleet-toolbar">
      <div class="chip-row">
        ${statuses.map(s=>`<div class="chip ${bookingFilter===s?'active':''}" onclick="setBookingFilter('${s}')">${s}</div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div class="search-box" style="width:220px;">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="bookingSearchInput" placeholder="Search customer or vehicle…" value="${bookingSearch}" oninput="setBookingSearch(this.value)"/>
        </div>
        <button class="btn btn-primary" onclick="openReservationModal()">${ICONS.plus} New reservation</button>
      </div>
    </div>

    ${list.length===0 ? `<div class="empty-state">No reservations match this search. Try a different filter or create a new booking.</div>` : `
    <table>
      <thead><tr>
        <th>Customer</th><th>Vehicle</th><th>Dates</th><th>Nights</th><th>Total</th><th>Status</th>
      </tr></thead>
      <tbody>
        ${list.map(r=>{
          const v = vehicleById(r.vehicleId);
          const nights = nightsBetween(r.start,r.end);
          return `
          <tr onclick="openReservation(${r.id})">
            <td><div class="t-name">${r.customer}</div><div class="t-sub">${r.phone}</div></td>
            <td>${v ? `<div class="t-name">${v.year} ${v.make} ${v.model}</div><div class="t-sub"><span class="plate" style="margin-top:2px;">${v.plate}<span class="plate-state">US</span></span></div>` : '<span class="t-sub">Vehicle removed</span>'}</td>
            <td class="mono">${fmtDate(r.start)} – ${fmtDate(r.end)}</td>
            <td class="mono">${nights}</td>
            <td class="mono">$${reservationTotal(r).toLocaleString()}</td>
            <td><span class="badge ${resBadgeClass(r.status)}">${r.status}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`}
  `;
}
function setBookingFilter(s){ bookingFilter=s; render(); }
function setBookingSearch(v){
  bookingSearch = v;
  const cursorPos = document.getElementById('bookingSearchInput')?.selectionStart ?? v.length;
  render();
  const input = document.getElementById('bookingSearchInput');
  if(input){ input.focus(); input.setSelectionRange(cursorPos, cursorPos); }
}

/* ============ RESERVATION DETAIL DRAWER ============ */
function openReservation(id){
  const r = reservations.find(x=>x.id===id);
  if(!r) return;
  const v = vehicleById(r.vehicleId);
  const nights = nightsBetween(r.start,r.end);
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <div class="drawer-head">
      <div>
        <div class="panel-title">${r.customer}</div>
        <div class="panel-sub">${v ? v.year+' '+v.make+' '+v.model : 'Vehicle removed'}</div>
      </div>
      <button class="close-x" onclick="closeDrawer()"><svg viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="drawer-body">
      <span class="badge ${resBadgeClass(r.status)}" style="margin-top:4px;">${r.status}</span>

      <div class="detail-grid">
        <div class="detail-field"><label>Phone</label><div>${r.phone}</div></div>
        <div class="detail-field"><label>Email</label><div style="font-size:12.5px;">${r.email}</div></div>
        <div class="detail-field"><label>Pick-up</label><div>${fmtDate(r.start)}</div></div>
        <div class="detail-field"><label>Return</label><div>${fmtDate(r.end)}</div></div>
        <div class="detail-field"><label>Nights</label><div class="mono">${nights}</div></div>
        <div class="detail-field"><label>Total</label><div class="mono">$${reservationTotal(r).toLocaleString()}</div></div>

      ${v ? `
      <div class="section-title">Vehicle</div>
      <div class="mini-list-item"><span><span class="plate">${v.plate}<span class="plate-state">US</span></span></span><span style="color:var(--ps-muted);">$${v.rate}/day</span></div>
      <div class="mini-list-item"><span>Location</span><span>${v.location}</span></div>
      ` : ''}

      <div class="section-title">Notes</div>
      <div class="mini-list-item"><span>No notes added yet.</span><span></span></div>

      <!-- CHANGED: Edit now opens the reservation modal pre-filled instead of just closing the drawer -->
      <div style="display:flex;gap:10px;margin-top:24px;">
        <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="openReservationModal(${r.id})">Edit reservation</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeDrawer()">Close</button>
      </div>
      <!-- CHANGED: Cancel is now available for every status, not just Upcoming/Active -->
      <button class="btn" style="width:100%;justify-content:center;margin-top:10px;background:var(--ps-danger-soft);color:var(--ps-danger);" onclick="confirmCancelReservation(${r.id})">
        ${ICONS.trash} Cancel reservation
      </button>
    </div>
  `;
  document.getElementById('drawerOverlay').classList.add('open');
}

/* ===== CHANGED: reservation cancel now uses the generic confirm modal ===== */
function confirmCancelReservation(id){
  const r = reservations.find(x=>x.id===id);
  if(!r) return;
  openConfirmModal(
    'Cancel reservation',
    `Cancel ${r.customer}'s reservation (${fmtDate(r.start)} – ${fmtDate(r.end)})? This can't be undone.`,
    'Cancel reservation',
    ()=>{ r.status = 'Cancelled'; logActivity('var(--ps-warning)', `Reservation cancelled — ${r.customer}`); closeDrawer(); render(); }
  );
}
/* ===== END CHANGED ===== */

/* ===== CHANGED: openReservationModal now supports edit mode (pass a reservation id) ===== */
function openReservationModal(editId=null){
  // ===== CHANGED: guard — can't book a reservation with an empty fleet =====
  if(vehicles.length===0 && editId===null){
    logActivity('var(--ps-warning)', 'Add a vehicle before creating a reservation');
    goTo('fleet');
    return;
  }
  // ===== END CHANGED =====
  const bookable = vehicles.filter(v=>v.status!=='Out of Service');
  const sel = document.getElementById('r-vehicle');
  sel.innerHTML = bookable.map(v=>`<option value="${v.id}">${v.year} ${v.make} ${v.model} — ${v.plate} ($${v.rate}/day, ${v.status})</option>`).join('');

  // ===== CHANGED: clear any leftover conflict error from a previous attempt =====
  const errEl = document.getElementById('r-error');
  errEl.style.display = 'none';
  errEl.textContent = '';
  // ===== END CHANGED =====

  const titleEl = document.querySelector('#reservationOverlay .panel-title');
  const submitBtn = document.querySelector('#reservationOverlay .modal-foot .btn-primary');

  if(editId){
    const r = reservations.find(x=>x.id===editId);
    if(!r) return;
    // make sure the reservation's current vehicle is selectable even if it's now Out of Service
    if(![...sel.options].some(o=>parseInt(o.value)===r.vehicleId)){
      const v = vehicleById(r.vehicleId);
      if(v){
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${v.year} ${v.make} ${v.model} — ${v.plate} ($${v.rate}/day, ${v.status})`;
        sel.appendChild(opt);
      }
    }
    document.getElementById('r-edit-id').value = r.id;
    document.getElementById('r-customer').value = r.customer;
    document.getElementById('r-phone').value = r.phone;
    document.getElementById('r-email').value = r.email;
    sel.value = r.vehicleId;
    document.getElementById('r-start').value = r.start;
    document.getElementById('r-end').value = r.end;
    titleEl.textContent = 'Edit reservation';
    submitBtn.textContent = 'Save changes';
  } else {
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('r-edit-id').value = '';
    document.getElementById('r-customer').value = '';
    document.getElementById('r-phone').value = '';
    document.getElementById('r-email').value = '';
    document.getElementById('r-start').value = today;
    document.getElementById('r-end').value = today;
    titleEl.textContent = 'New reservation';
    submitBtn.textContent = 'Create reservation';
  }
  document.getElementById('reservationOverlay').classList.add('open');
}

function closeReservationModal(){ document.getElementById('reservationOverlay').classList.remove('open'); }

// ===== CHANGED: detect overlapping bookings for the same vehicle =====
function hasBookingConflict(vehicleId, start, end, excludeId=null){
  return reservations.some(r=>{
    if(r.status==='Cancelled') return false;
    if(excludeId!==null && r.id===excludeId) return false;
    if(r.vehicleId!==vehicleId) return false;
    return start <= r.end && r.start <= end; // date ranges overlap
  });
}
function showReservationError(msg){
  const el = document.getElementById('r-error');
  el.textContent = msg;
  el.style.display = 'block';
}
// ===== END CHANGED =====

function submitReservation(){
  const editId = document.getElementById('r-edit-id').value;
  const customer = document.getElementById('r-customer').value.trim() || 'Unnamed customer';
  const phone = document.getElementById('r-phone').value.trim() || '—';
  const email = document.getElementById('r-email').value.trim() || '—';
  const vehicleId = parseInt(document.getElementById('r-vehicle').value);
  let start = document.getElementById('r-start').value;
  let end = document.getElementById('r-end').value;
  if(!start) start = new Date().toISOString().slice(0,10);
  if(!end || end < start) end = start;

  // ===== CHANGED: block the booking if this vehicle is already reserved for an overlapping date range =====
  const excludeId = editId ? parseInt(editId) : null;
  if(hasBookingConflict(vehicleId, start, end, excludeId)){
    const v = vehicleById(vehicleId);
    showReservationError(`${v ? v.year+' '+v.make+' '+v.model+' ('+v.plate+')' : 'This vehicle'} is already booked for an overlapping date range. Choose different dates or a different vehicle.`);
    return;
  }
  document.getElementById('r-error').style.display = 'none';
  // ===== END CHANGED =====

  const todayStr = new Date().toISOString().slice(0,10);
  const computedStatus = start > todayStr ? 'Upcoming' : (end < todayStr ? 'Completed' : 'Active');

  if(editId){
    const r = reservations.find(x=>x.id===parseInt(editId));
    if(r){
      r.customer=customer; r.phone=phone; r.email=email; r.vehicleId=vehicleId; r.start=start; r.end=end;
      // don't silently un-cancel a cancelled reservation just because dates were edited
      if(r.status !== 'Cancelled') r.status = computedStatus;
      logActivity('var(--ps-primary)', `Reservation updated for ${customer}`);
    }
  } else {
    reservations.push({id:nextResId++, customer, phone, email, vehicleId, start, end, status:computedStatus});
    const v = vehicleById(vehicleId);
    const nights = nightsBetween(start,end);
    logActivity('var(--ps-primary)', `New reservation booked — ${v?v.make+' '+v.model:'vehicle'} (${v?v.plate:'—'}), ${nights} day${nights===1?'':'s'} for ${customer}`);
  }

  ['r-customer','r-phone','r-email'].forEach(id=>document.getElementById(id).value='');
  closeReservationModal();
  goTo('booking');
}
/* ===== END CHANGED ===== */

  if(isOverdue(m)) return {label:'Overdue', cls:'badge-out'};

  reservations.filter(r=>r.status==='Active'||r.status==='Completed').forEach(r=>{
    const v = vehicleById(r.vehicleId);
    entries.push({date:r.start, desc:`Reservation — ${r.customer}${v?' ('+v.plate+')':''}`, type:'Income', source:'Reservation', amount:reservationTotal(r)});
  });
  maintenanceRecords.filter(m=>m.status==='Completed').forEach(m=>{
    const v = vehicleById(m.vehicleId);
    entries.push({date:m.date, desc:`${m.type}${v?' — '+v.make+' '+v.model:''}`, type:'Expense', source:'Maintenance', amount:-m.cost});
  });
  entries.sort((a,b)=> new Date(a.date) - new Date(b.date));
  let running = 0;
  entries.forEach(e=>{ running += e.amount; e.balance = running; });
  return entries.slice().reverse();
}

/* ============ PAGE: FINANCIAL DASHBOARD ============ */
function vehicleRevenueBreakdown(){
  const totals = {};
  reservations.filter(r=>r.status==='Active'||r.status==='Completed').forEach(r=>{
    const v = vehicleById(r.vehicleId);
    if(!v) return;
    const label = `${v.year} ${v.make} ${v.model}`;
    totals[label] = (totals[label]||0) + reservationTotal(r);
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}
function maintenanceTypeBreakdown(){
  const totals = {};
  maintenanceRecords.filter(m=>m.status==='Completed').forEach(m=>{
    totals[m.type] = (totals[m.type]||0) + m.cost;
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]);
}
function renderFinance(){
  const totalRevenue = reservations.filter(r=>r.status==='Active'||r.status==='Completed').reduce((s,r)=>s+reservationTotal(r),0);
  const totalExpenses = maintenanceRecords.filter(m=>m.status==='Completed').reduce((s,m)=>s+m.cost,0);
  const netProfit = totalRevenue - totalExpenses;
  const margin = totalRevenue ? Math.round((netProfit/totalRevenue)*100) : 0;

  const vehicleRevenue = vehicleRevenueBreakdown().slice(0,5);
  const maxVehicleRevenue = Math.max(...vehicleRevenue.map(v=>v[1]), 1);
  const expenseBreakdown = maintenanceTypeBreakdown();
  const maxExpense = Math.max(...expenseBreakdown.map(e=>e[1]), 1);

  return `
    <div class="kpi-row" style="grid-template-columns:repeat(4,1fr);">
      <div class="kpi-card"><div class="kpi-label">Total Revenue</div><div class="kpi-value" style="color:var(--ps-success);">$${totalRevenue.toLocaleString()}</div></div>
      <div class="kpi-card"><div class="kpi-label">Total Expenses</div><div class="kpi-value" style="color:var(--ps-danger);">$${totalExpenses.toLocaleString()}</div></div>
      <div class="kpi-card"><div class="kpi-label">Net Profit</div><div class="kpi-value" style="color:${netProfit>=0?'var(--ps-success)':'var(--ps-danger)'};">${fmtCurrency(netProfit)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Profit Margin</div><div class="kpi-value">${margin}%</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><div><div class="panel-title">Top vehicles by revenue</div><div class="panel-sub">From active & completed rentals</div></div></div>
        ${vehicleRevenue.length ? vehicleRevenue.map(([label,amt])=>moneyBar(label, amt, maxVehicleRevenue, 'var(--ps-primary)')).join('') : '<div class="empty-state">No revenue recorded yet.</div>'}
      </div>
      <div class="panel">
        <div class="panel-head"><div><div class="panel-title">Maintenance spend by type</div><div class="panel-sub">Completed services only</div></div></div>
        ${expenseBreakdown.length ? expenseBreakdown.map(([label,amt])=>moneyBar(label, amt, maxExpense, 'var(--ps-danger)')).join('') : '<div class="empty-state">No completed maintenance yet.</div>'}
      </div>
    </div>
  `;
}

/* ===== CHANGED: new CRM module — customers derived live from Reservations, no separate mock data ===== */
/* ============ PAGE: CRM (derived from Reservations) ============ */
function crmCustomers(){
  const map = {};
  reservations.forEach(r=>{
    const key = r.customer+'|'+r.phone+'|'+r.email;
    if(!map[key]) map[key] = {customer:r.customer, phone:r.phone, email:r.email, reservations:[]};
    map[key].reservations.push(r);
  });
  return Object.values(map).map(c=>{
    const activeReservations = c.reservations.filter(r=>r.status!=='Cancelled');
    const totalSpent = c.reservations.filter(r=>r.status==='Active'||r.status==='Completed').reduce((s,r)=>s+reservationTotal(r),0);
    const lastDate = c.reservations.reduce((latest,r)=> r.start>latest?r.start:latest, '0000-00-00');
    const isActive = c.reservations.some(r=>r.status==='Active'||r.status==='Upcoming');
    return {...c, bookingCount:activeReservations.length, totalSpent, lastDate, status:isActive?'Active':'Past'};
  }).sort((a,b)=> b.totalSpent - a.totalSpent);
}
function filteredCrmCustomers(){
  return crmCustomers().filter(c=>{
    const matchesStatus = crmFilter==='All' || c.status===crmFilter;
    const q = crmSearch.toLowerCase();
    const label = c.customer+' '+c.phone+' '+c.email;
    const matchesSearch = !q || label.toLowerCase().includes(q);
    return matchesStatus && matchesSearch;
  });
}

  return `

    ${list.length===0 ? `<div class="empty-state">No customers match this search. Customers appear here automatically once you create a reservation.</div>` : `

function submitAddVehicle(){
  const editId = document.getElementById('f-edit-id').value;
  const make = document.getElementById('f-make').value.trim() || 'Unknown';
  const model = document.getElementById('f-model').value.trim() || 'Model';
  const year = parseInt(document.getElementById('f-year').value) || new Date().getFullYear();
  const type = document.getElementById('f-type').value;
  const plate = document.getElementById('f-plate').value.trim() || 'NEWPLT';
  const vin = document.getElementById('f-vin').value.trim() || '—';
  const rate = parseInt(document.getElementById('f-rate').value) || 60;
  const location = document.getElementById('f-location').value;
  const status = document.getElementById('f-status').value;
  const colorMap = {Sedan:'#0E5B52',SUV:'#1B4D6B',Van:'#0E5B52',Truck:'#A8551F',Luxury:'#3B3B3B'};

  if(editId){
    const v = vehicles.find(x=>x.id===parseInt(editId));
    if(v){
      Object.assign(v, {make, model, year, type, plate, vin, rate, location, status, color:colorMap[type]});
      logActivity('var(--ps-primary)', `${year} ${make} ${model} (${plate}) updated`);
    }
  } else {
    vehicles.unshift({id:nextId++, make, model, year, type, plate, vin, status, mileage:0, rate, location, nextService:3000, color:colorMap[type]});
    logActivity('var(--ps-success)', `${year} ${make} ${model} (${plate}) added to fleet`);
  }

  ['f-make','f-model','f-year','f-plate','f-vin','f-rate'].forEach(id=>document.getElementById(id).value='');
  closeAddModal();
  render();
}

/* ============ MAIN RENDER ============ */
function render(){
  const el = document.getElementById('content');
  if(currentPage==='dashboard') el.innerHTML = renderDashboard();
  else if(currentPage==='fleet') el.innerHTML = renderFleet();
  else if(currentPage==='booking') el.innerHTML = renderBooking();
  else if(currentPage==='maintenance') el.innerHTML = renderMaintenance();
  else if(currentPage==='crm') el.innerHTML = renderCrm();
  else if(currentPage==='finance') el.innerHTML = renderFinance();
  else if(currentPage==='expense') el.innerHTML = renderExpense();
  else if(currentPage==='accounting') el.innerHTML = renderAccounting();
  else if(currentPage==='payments') el.innerHTML = renderPayments();
  else el.innerHTML = renderSoon(currentPage);
}

// ===== CHANGED: was just `renderNav(); render();` — now waits for a name first =====
/* ============ OWNER NAME / STARTUP ============ */
async function initOwner(){
  try{
    const res = await window.storage.get('owner_name');
    if(res && res.value){
      ownerName = res.value;
      startApp();
      return;
    }
  }catch(err){
    // no name saved yet, or storage unavailable — fall through to welcome screen
  }
  document.getElementById('ownerNameInput').focus();
}

async function submitOwnerName(){
  const val = document.getElementById('ownerNameInput').value.trim();
  if(!val) return;
  ownerName = val;
  try{
    await window.storage.set('owner_name', val);
  }catch(err){
    console.error('Could not save name:', err);
  }
  document.getElementById('welcomeOverlay').classList.remove('open');
  startApp();
}

function startApp(){
  document.getElementById('welcomeOverlay').classList.remove('open');
  document.getElementById('appRoot').style.display = 'flex';
  document.getElementById('ownerNameDisplay').textContent = ownerName;
  document.getElementById('ownerInitials').textContent = ownerInitials() || '—';
  renderNav();
  render();
}

initOwner();

// ===== CHANGED: keep "X min ago" timestamps fresh while sitting on the Dashboard =====
setInterval(()=>{ if(currentPage==='dashboard') render(); }, 30000);
